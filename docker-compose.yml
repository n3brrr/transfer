# Sin "restart": nada arranca solo, se levanta a mano con "docker compose up -d".
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    expose:
      - "8080"
    environment:
      TRUST_PROXY: "1" # la IP del cliente se lee de X-Forwarded-For (solo es de fiar detrás de Caddy)
      ALLOWED_ORIGINS: "https://${DOMAIN:?falta DOMAIN en el archivo .env}" # el WebSocket solo acepta la web de esta dirección
    init: true # PID 1 que recoge procesos y reenvía señales
    read_only: true # el servidor no escribe en disco
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    networks:
      - interna # sin salida a internet: solo Caddy puede hablar con ella
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    build:
      context: docker
      dockerfile: Dockerfile.caddy
    ports:
      # BIND_IP (en .env): IP local del PC. Con ella el 443 no se publica en otras interfaces
      - "${BIND_IP:-0.0.0.0}:443:443"
    env_file: .env
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    read_only: true # Caddy solo escribe en /data (volumen), /config y /tmp
    tmpfs:
      - /tmp
      - /config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # escuchar en el 443 dentro del contenedor
    mem_limit: 256m
    pids_limit: 200
    networks:
      - interna
      - publica
    logging: *logging
    depends_on:
      app:
        condition: service_healthy # Caddy espera a que la app responda a /health

networks:
  interna:
    internal: true
  publica: {}

volumes:
  caddy_data:
